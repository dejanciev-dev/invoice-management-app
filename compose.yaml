# Runs the app with SQL Server: `docker compose up --build`, then open http://localhost:8080
# Sign in with demo@example.com / Demo123! (a company admin) or admin@example.com / Admin123! (platform admin),
# both seeded on first start. This is a local demo: the Demo__* settings below must never reach a real server.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Local_dev_Passw0rd}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: Server=db;Database=ManagementApp;User Id=sa;Password=${DB_PASSWORD:-Local_dev_Passw0rd};TrustServerCertificate=True
      App__PublicBaseUrl: http://localhost:8080
      Database__SeedDemoData: "true"
      Demo__Enabled: "true"
      Demo__AllowInProduction: "true"
      FileStorage__LocalRootPath: /home/app/files
    volumes:
      - keys:/home/app/.aspnet/DataProtection-Keys
      - files:/home/app/files
    depends_on:
      db:
        condition: service_healthy

volumes:
  sqldata:
  keys:
  files:
